
services:
  fp03-locked-door:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fp03-locked-door
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - ctf-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

networks:
  ctf-network:
    driver: bridge
